<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logging in…</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Avenir Next", "Segoe UI", Arial, sans-serif;
      background: #FFFC00; height: 100vh; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
    }
    .ghost {
      width: 74px; height: 74px; border-radius: 50%;
      background: #111 url('img/snapchat-logo-svgrepo-com.svg') no-repeat center / 62% auto;
      animation: pulse 1.1s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
    p { margin-top: 18px; font-size: 15px; font-weight: 700; color: #111; }
    .spin {
      margin-top: 22px; width: 26px; height: 26px; border-radius: 50%;
      border: 3px solid rgba(0, 0, 0, .15); border-top-color: #111;
      animation: rot .8s linear infinite;
    }
    @keyframes rot { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="ghost"></div>
  <p>Logging you in…</p>
  <div class="spin"></div>
  <script>
    // Static demo (Netlify build): nothing is transmitted to any server.
    // The typed values live only in this tab's sessionStorage and are wiped
    // the moment the debrief page renders.
    setTimeout(function () {
      window.location.href = 'debrief.html';
    }, 1200);
  </script>
</body>
</html>
